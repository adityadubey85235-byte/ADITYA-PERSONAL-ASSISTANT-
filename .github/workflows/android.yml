
name: Build Aditya JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Aditya-Personal-JARVIS-v0.2.0.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager nahi mila"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check project ZIP
        shell: bash
        run: |
          ZIP_FILE="Aditya-Personal-JARVIS-v0.2.0.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP repository mein nahi mili."
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -o "Aditya-Personal-JARVIS-v0.2.0.zip" -d extracted

          PROJECT_DIR="$(find extracted -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: ZIP mein gradlew nahi mila."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file nahi mili."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and Rename APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

          APK_FILE="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Build ke baad APK nahi mili."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/Aditya-Personal-JARVIS.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aditya-Personal-JARVIS-APK
          path: output/Aditya-Personal-JARVIS.apk
          if-no-files-found: error
          
