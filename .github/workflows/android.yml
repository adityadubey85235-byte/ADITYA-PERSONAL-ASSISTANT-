
name: Build Aditya Personal JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Aditya-Personal-JARVIS-v0.2.0.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nahi mila."
            exit 1
          fi

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validate project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/Aditya-Personal-JARVIS-v0.2.0.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP repository mein nahi mili."
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/aditya-jarvis"
          mkdir -p "$EXTRACT_DIR"

          unzip -o \
            "$GITHUB_WORKSPACE/Aditya-Personal-JARVIS-v0.2.0.zip" \
            -d "$EXTRACT_DIR"

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE/app/build.gradle" ] || \
               [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find "$EXTRACT_DIR" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project nahi mila."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Build ke baad APK nahi mili."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/output/Aditya-Personal-JARVIS.apk"

          ls -lh "$GITHUB_WORKSPACE/output/Aditya-Personal-JARVIS.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aditya-Personal-JARVIS-APK
          path: output/Aditya-Personal-JARVIS.apk
          if-no-files-found: error
          retention-days: 7
          
